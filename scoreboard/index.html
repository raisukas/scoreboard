    </head>
    <body>
        <div class="container">
            <div class="column">
                <h3>HOME</h3>
                <div class="score-container">
                    <h2 id="home-score">0</h2>
                </div> 
                <div class="button-container">
                    <button id="increment-one" onclick="homeIncrementOne()">+1</button>
                    <button id="increment-two" onclick="homeIncrementTwo()">+2</button>
                    <button id="increment-three" onclick="homeIncrementThree()">+3</button>
                </div>
            </div>     
                           
            <div class="column">
                <h3>AWAY</h3>
                <h2 class="score" id="away-score">0</h2>
                <div>
                    <button id="guest-increment-one" onclick="awayIncrementOne()">+1</button>
                    <button id="guest-increment-two" onclick="awayIncrementTwo()">+2</button>
                    <button id="guest-increment-three" onclick="awayIncrementThree()">+3</button>
                </div>
            </div>   
        </div>
        <script src="index.js"></script>
    </body>
</html>
